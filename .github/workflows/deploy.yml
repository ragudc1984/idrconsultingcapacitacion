# Publicacion: en cada push a main repite la puerta de verificacion y, solo si
# pasa, publica apps/web/dist/ en GitHub Pages. Repite los pasos de ci.yml a proposito:
# un despliegue que confia en que otro workflow ya verifico es un despliegue que
# un dia publica algo roto.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez; la que esta en curso termina en vez de cancelarse,
# para no dejar el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        run: npm run build

      - name: Lint
        run: npm run lint

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
